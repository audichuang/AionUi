name: '🚀 Build My Integrated'

# 只在你的 fork 上觸發，不會影響 upstream
# 推送 my-integrated 分支 或手動觸發

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [ my-integrated ]
  workflow_dispatch:
    inputs:
      skip_code_quality:
        description: 'Skip code quality checks'
        required: false
        type: boolean
        default: true

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # 安全檢查：只在 fork 上執行
  check-fork:
    name: Verify Fork
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        run: |
          if [ "${{ github.repository }}" = "iOfficeAI/AionUi" ]; then
            echo "::error::This workflow should only run on forks"
            exit 1
          fi
          echo "✅ Running on fork: ${{ github.repository }}"

  build-pipeline:
    name: Build Pipeline
    needs: check-fork
    uses: ./.github/workflows/_build-reusable.yml
    with:
      # 只打包 Mac ARM64 和 Linux
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"linux","os":"ubuntu-latest","command":"bun run dist:linux","artifact-name":"linux-build","arch":"x64-arm64"}
        ]}
      skip_code_quality: ${{ inputs.skip_code_quality || true }}
      append_commit_hash: true
    secrets: inherit

  release:
    name: Create Dev Release
    runs-on: macos-14
    needs: build-pipeline
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Release: $TAG_NAME"

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find build-artifacts -type f \( \
            -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \
            -o -name "*.zip" -o -name "*.yml" -o -name "*.blockmap" \
          \) -exec cp {} release-assets/ \;
          echo "📦 Release assets:"
          ls -lh release-assets/

      - name: Create or update tag
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "My Build ${{ steps.version.outputs.tag_name }}"
          files: release-assets/*
          generate_release_notes: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 直接 clone homebrew-tap 並更新 (參考 skills-hub 做法)
      - name: Calculate SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag_name }}"

          # macOS DMG
          DMG=$(find release-assets -name "*-mac-arm64.dmg" | head -1)
          if [ -n "$DMG" ]; then
            SHA_DMG=$(shasum -a 256 "$DMG" | awk '{print $1}')
            echo "dmg_sha=$SHA_DMG" >> $GITHUB_OUTPUT
            echo "dmg_name=$(basename $DMG)" >> $GITHUB_OUTPUT
            echo "DMG SHA256: $SHA_DMG"
          fi

          # Linux AppImage x64
          APPIMAGE=$(find release-assets -name "*-linux-x86_64.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            SHA_APPIMAGE=$(shasum -a 256 "$APPIMAGE" | awk '{print $1}')
            echo "appimage_sha=$SHA_APPIMAGE" >> $GITHUB_OUTPUT
            echo "appimage_name=$(basename $APPIMAGE)" >> $GITHUB_OUTPUT
            echo "AppImage SHA256: $SHA_APPIMAGE"
          fi

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "⚠️ HOMEBREW_TAP_TOKEN not configured, skipping tap update"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag_name }}"
          SHA_DMG="${{ steps.sha.outputs.dmg_sha }}"
          SHA_APPIMAGE="${{ steps.sha.outputs.appimage_sha }}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-tap.git" tap
          cd tap

          # --- Update Cask (macOS) ---
          # URL 使用 #{version} 動態推算 tag，只需更新 version 和 sha256
          CASK_FILE="Casks/aionui-dev.rb"
          if [ -f "$CASK_FILE" ] && [ -n "${SHA_DMG:-}" ]; then
            sed -i '' "s/version \".*\"/version \"${VERSION}\"/" "$CASK_FILE"
            sed -i '' "s/sha256 .*/sha256 \"${SHA_DMG}\"/" "$CASK_FILE"
            echo "✅ Updated Cask:"
            cat "$CASK_FILE"
          fi

          # --- Update Formula (Linux) ---
          FORMULA_FILE="Formula/aionui-dev.rb"
          if [ -f "$FORMULA_FILE" ] && [ -n "${SHA_APPIMAGE:-}" ]; then
            sed -i '' "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA_FILE"
            sed -i '' "s/sha256 .*/sha256 \"${SHA_APPIMAGE}\"/" "$FORMULA_FILE"
            echo "✅ Updated Formula:"
            cat "$FORMULA_FILE"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: bump aionui-dev to ${TAG}"
          git push
          echo "✅ homebrew-tap updated!"
